name: build

# Код уезжает в репозиторий на каждой сборке, поэтому проверки гоняем на каждый push.
# Релиз делается здесь же, а не с машины разработчика: в Actions токен доступен сам собой,
# и главное — файлы прошивки выкладываются только после того, как тесты и сборка прошли.
on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write        # нужно для создания релиза и загрузки файлов

jobs:
  build:
    runs-on: ubuntu-latest
    # Прошивка и ядро лежат в workspace рядом (этого требует symlink://../mesh-network-core),
    # поэтому все команды выполняются из каталога прошивки, а не из корня workspace.
    defaults:
      run:
        working-directory: meshcore-fork
    steps:
      - uses: actions/checkout@v4
        with:
          path: meshcore-fork
          # Нужны вся история и теги: из них собирается список отличий от прошлого релиза.
          # По умолчанию checkout берёт одну ревизию, и сравнивать было бы не с чем.
          fetch-depth: 0

      # Ядро протокола (radio, mesh_rx/tx, ota, crypto, appconfig) — отдельный репозиторий,
      # и platformio.ini подключает его как symlink://../mesh-network-core. На машине
      # разработчика это соседний каталог; здесь его надо положить рядом самим, иначе
      # сборка падает на ненайденной библиотеке. Версия берётся из core.ref: CI собирает
      # именно тот тег ядра, который объявлен в этой ветке, а не «что там сейчас в main».
      - name: Версия ядра из core.ref
        id: core
        run: echo "ref=$(head -1 core.ref)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: Tr1glav/mesh-network-core
          ref: ${{ steps.core.outputs.ref }}
          path: mesh-network-core

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Пакеты платформы весят сотни мегабайт и скачиваются долго — кешируем между запусками
      - name: Кеш PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            meshcore-fork/.pio/libdeps
          key: pio-${{ runner.os }}-${{ hashFiles('meshcore-fork/platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Установка PlatformIO
        run: pip install --upgrade platformio

      # Проверки на хосте: границы буферов с санитайзерами, формат .otaz, сканер маркера
      # платы, синтаксис страницы. Им нужны g++ и node — на ubuntu-latest они есть.
      - name: Проверки на ПК
        run: python3 scripts/selftest.py

      # NOGIT=1 обязателен: post-скрипт сборки (scripts/copy_firmware.py) иначе зовёт
      # scripts/release.py, а тот делает git add -A, коммит и push. У Actions есть и права
      # (contents: write), и сохранённые checkout'ом учётные данные, так что push проходит —
      # и запускает этот же workflow заново. Коммиты в репозиторий делает сборка на машине
      # разработчика, а не CI.
      # Без -e: собираем ровно default_envs из platformio.ini. Список здесь уже разошёлся с
      # ним — не собирались оба *_support, и в релиз их .otaz не попадал. Для прошивальщика
      # это значило, что он не может обновить себя сам: он ищет в релизе файл
      # <окружение>_v<версия>, а его там не было. Держать список в двух местах нечем.
      - name: Сборка прошивок
        env:
          NOGIT: '1'
        run: pio run

      - name: Версия из version.txt
        id: ver
        run: echo "version=$(head -1 version.txt)" >> "$GITHUB_OUTPUT"

      - name: Список собранного
        run: ls -la firmware_output/

      # Сборки любой ветки складываем как артефакт — их можно скачать из интерфейса Actions
      - name: Артефакты сборки
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ steps.ver.outputs.version }}
          path: |
            meshcore-fork/firmware_output/*.bin
            meshcore-fork/firmware_output/*.otaz
          if-no-files-found: error

      # Релиз — только для веток release/v*, и только если всё выше прошло успешно.
      # Шаги в задании идут последовательно: упал selftest или сборка — сюда не дойдёт.
      - name: Релиз с файлами прошивки
        if: startsWith(github.ref, 'refs/heads/release/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.ver.outputs.version }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "релиз $TAG уже существует, обновляю файлы"
            gh release upload "$TAG" firmware_output/*.bin firmware_output/*.otaz --clobber
            exit 0
          fi

          # Описание релиза — отличия от предыдущего тега. Коммиты сборки называются
          # просто номером версии, поэтому такие строки отбрасываем: в списке остаются
          # только осмысленные сообщения. Если их не осталось, показываем хотя бы то,
          # какие файлы менялись.
          PREV=$(git tag -l 'v*' --sort=-v:refname | grep -v "^$TAG$" | head -1)
          if [ -n "$PREV" ]; then
            # Голые номера версий выбрасываем, а у остальных срезаем приставку «vX.Y.Z: »:
            # номер релиза уже стоит в заголовке, в списке изменений он только мешает.
            CHANGES=$(git log --no-merges --pretty=format:'- %s' "$PREV"..HEAD \
                      | grep -vE '^- v[0-9]+\.[0-9]+\.[0-9]+$' \
                      | sed -E 's/^- v[0-9]+\.[0-9]+\.[0-9]+: /- /' | awk '!seen[$0]++')
            STAT=$(git diff --shortstat "$PREV"..HEAD)
            {
              echo "### Изменения с $PREV"
              echo
              if [ -n "$CHANGES" ]; then echo "$CHANGES"; else echo "- правки без отдельного описания"; fi
              echo
              [ -n "$STAT" ] && echo "_${STAT}_"
            } > notes.md
          else
            echo "### Первый релиз" > notes.md
          fi
          {
            echo
            echo "---"
            echo "Координатор — файл \`.bin\` (через страницу OTA), сенсор и компаньон — \`.otaz\` (уходят по радио)."
            echo "Автообновление ищет файл по имени окружения: \`<окружение>_v<версия>\`."
          } >> notes.md

          gh release create "$TAG" \
            --target "${{ github.sha }}" \
            --title "$TAG" \
            --notes-file notes.md \
            firmware_output/*.bin firmware_output/*.otaz

      # Старые релизы не нужны: файлы в них весят по мегабайту на окружение, а узлы
      # обновляются на последнюю версию. Пяти свежих хватает, чтобы откатиться, если новая
      # прошивка окажется хуже предыдущей.
      #
      # Теги при этом остаются: они ничего не весят, и по ним видно, из какого кода собран
      # каждый выпуск (а ещё из них workflow берёт предыдущую версию для списка изменений).
      # Отдельным шагом, а не в конце предыдущего: тот при уже существующем релизе выходит
      # через exit 0, и продолжение в нём не выполнялось бы.
      #
      # Своё удаление не роняет выпуск: релиз уже опубликован, и неудачная уборка — не повод
      # красить сборку в красное.
      - name: Убрать старые релизы (оставить пять)
        if: startsWith(github.ref, 'refs/heads/release/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Сортируем сами, а не надеемся на порядок вывода gh: удалять не то, что задумано,
          # тут стоило бы дорого.
          old=$(gh release list --limit 200 --json tagName,createdAt \
                --jq 'sort_by(.createdAt) | reverse | .[5:] | .[].tagName') || old=""
          if [ -z "$old" ]; then
            echo "релизов не больше пяти — удалять нечего"
            exit 0
          fi
          for tag in $old; do
            echo "удаляю релиз $tag (тег остаётся)"
            gh release delete "$tag" --yes || echo "не удалось удалить $tag, продолжаю"
          done
